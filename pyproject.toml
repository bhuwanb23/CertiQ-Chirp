[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certiq-chirp"
version = "0.1.0"
description = "A reproducible, quantum-classical banking campaign benchmark with exact certificates."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "qiskit==2.6.2",
  "qiskit-aer==0.18.2",
  "qiskit-algorithms==0.4.0",
  "qiskit-machine-learning==0.9.1",
  "catboost==1.2.10",
  "lightgbm==4.7.0",
  "xgboost==3.4.1",
  "scipy==1.17.1",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
certiq-chirp = "certiq_chirp.pipeline:main"
certiq-chirp-report = "certiq_chirp.reporting:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
